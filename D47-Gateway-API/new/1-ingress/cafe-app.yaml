# cafe-app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee-1
  template:
    metadata:
      labels:
        app: coffee-1
    spec:
      containers:
      - name: coffee
        image: nginxdemos/nginx-hello:plain-text
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-1
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: coffee-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tea-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tea-1
  template:
    metadata:
      labels:
        app: tea-1
    spec:
      containers:
      - name: tea
        image: nginxdemos/nginx-hello:plain-text
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tea-1
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: tea-1